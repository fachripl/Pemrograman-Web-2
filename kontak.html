<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya - Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">Website Saya</div>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="kontak.html" class="active">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <!-- Kontak -->
    <main>
        <section class="page-header">
            <h1>Kontak</h1>
            <p>Silakan hubungi saya melalui informasi berikut</p>
        </section>

        <section class="contact-section">

            <div class="contact-info">
                <h2>Informasi Kontak</h2>

                <div class="contact-item">
                    <h3>📍 Alamat</h3>
                    <p>Palu, Sulawesi Tengah, Indonesia</p>
                </div>

                <div class="contact-item">
                    <h3>📧 Email</h3>
                    <p>emailanda@gmail.com</p>
                </div>

                <div class="contact-item">
                    <h3>📱 Telepon</h3>
                    <p>08xxxxxxxxxx</p>
                </div>
            </div>

            <div class="contact-form">
                <h2>Kirim Pesan</h2>

                <form>
                    <label for="nama">Nama</label>
                    <input 
                        type="text" 
                        id="nama" 
                        name="nama"
                        placeholder="Masukkan nama Anda"
                    >

                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="Masukkan email Anda"
                    >

                    <label for="pesan">Pesan</label>
                    <textarea 
                        id="pesan" 
                        name="pesan"
                        rows="5"
                        placeholder="Tuliskan pesan Anda..."
                    ></textarea>

                    <button type="submit">
                        Kirim Pesan
                    </button>
                </form>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Website Saya. All Rights Reserved.</p>
    </footer>

</body>
</html>
